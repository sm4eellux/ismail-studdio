<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — APEX FITNESS</title>
<meta name="description" content="Contact APEX FITNESS, a fictional gym demo: inquiry form, WhatsApp, Instagram and opening hours.">
<meta name="theme-color" content="#090B0D">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="contact">
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">

<section class="page-hero"><div class="container"><p class="eyebrow">APEX FITNESS</p><h1>Get in touch.</h1><p>Questions about memberships or programs? Send a message — this is a demonstration site.</p></div></section>
<section class="section"><div class="container contact">
 <div class="reveal"><ul class="info" id="info"><li><b>Address</b><span id="c-addr"></span></li><li><b>Phone</b><span id="c-phone"></span></li><li><b>Email</b><a id="c-mail"></a></li><li><b>Social</b><a id="wa-link" target="_blank" rel="noopener">WhatsApp</a> · <a id="c-ig" target="_blank" rel="noopener">Instagram</a></li><li><b>Opening hours</b><span id="c-hours"></span></li></ul>
 <div class="mapcard"><h3>Find the club</h3><p class="muted">Placeholder location for this demo.</p><div class="btn-row"><a id="c-map" class="btn" target="_blank" rel="noopener">Open in Google Maps</a></div></div></div>
 <form id="contact-form" class="reveal" novalidate>
  <div class="field"><label for="f-name">Full name</label><input id="f-name" name="name" autocomplete="name" required><span class="err"></span></div>
  <div class="field"><label for="f-email">Email address</label><input id="f-email" name="email" type="email" autocomplete="email" required><span class="err"></span></div>
  <div class="field"><label for="f-phone">Phone number</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" required><span class="err"></span></div>
  <div class="field"><label for="f-subject">Subject</label><input id="f-subject" name="subject" required><span class="err"></span></div>
  <div class="field"><label for="f-message">Message</label><textarea id="f-message" name="message" required></textarea><span class="err"></span></div>
  <button class="btn btn--solid" type="submit">Send message</button>
  <div id="form-result" class="result" tabindex="-1" role="status" hidden></div></form></div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/config.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/contact.js" defer></script>
</body>
</html>
